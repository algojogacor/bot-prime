name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          # Placeholder credentials so config validation passes in CI (no real services touched).
          TURSO_DATABASE_URL: file:./data/test.db
          AUTH_ENCRYPTION_KEY: dGVzdC1rZXktZm9yLWNpLXJ1bm5lcnMtd29ya2Zsb3c9
          AI_API_KEY: test-key
          OMAK_MAX_DAILY_AI_CALLS: '300'

      - name: Build
        run: npm run build

      - name: Dependency audit (report-only)
        run: npm audit --audit-level=high
        continue-on-error: true
